org.gradle.jvmargs=-Xmx1200m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.workers.max=1
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.incremental=true

# Authoritative version identity. Bump BOTH when the shipped behaviour changes.
# These are committed deliberately: deriving the version from git meant the same
# source produced a different APK depending on which repository contained it,
# which made the md5 in the docs unverifiable. The commit is reported separately
# as BuildConfig.BUILD_COMMIT and shown under Connection -> Build.
bta.versionCode=25
bta.versionName=1.0.25
