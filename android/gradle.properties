org.gradle.jvmargs=-Xmx1200m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.workers.max=1
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.incremental=true

# Fallback version identity, used only when the build directory is not the root of
# its own git checkout (for example a source export). A real checkout derives the
# version from its own history instead. Override with -Pbta.versionCode=42.
bta.versionCode=20
bta.versionName=1.0.20
